name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/cutelyrose/codex_keepalive_v20

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: any/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check application
        working-directory: any
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push commit image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test container and persistent data
        env:
          COMPOSE_PROJECT_NAME: anyrouter-ci
          ANYROUTER_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          ANYROUTER_ORIGIN: http://127.0.0.1:8787
          ANYROUTER_PASSWORD: ci-smoke-password
        run: |
          docker compose up -d --wait --wait-timeout 90
          node any/tests/container.test.mjs
      - name: Publish latest after checks pass
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:latest"
          echo "Published: $IMAGE:latest ($GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop test container
        if: always()
        env:
          COMPOSE_PROJECT_NAME: anyrouter-ci
          ANYROUTER_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          ANYROUTER_ORIGIN: http://127.0.0.1:8787
          ANYROUTER_PASSWORD: ci-smoke-password
        run: |
          docker compose logs --tail=50
          docker compose down --volumes
