<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('anyrouter-console:theme:v1');
          const theme = saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1320' : '#f5f7fb';
        } catch {}
      })();
    </script>
    <meta
      name="description"
      content="AnyRouter 浏览器请求调度台"
    />
    <title>AnyRouter 请求调度台</title>
    <script type="module" src="/assets/app.js"></script>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <div id="app"></div>
    <noscript>请启用 JavaScript 以使用 AnyRouter 工作区。</noscript>
</body>
</html>
